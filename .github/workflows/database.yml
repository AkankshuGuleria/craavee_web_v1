name: Database

# Schema/RLS/trigger correctness gate: starts the local Supabase stack,
# applies every migration plus the dev seed exactly as `supabase db reset`
# would locally, then runs the full pgTAP suite via the project's own
# runner (scripts/run-db-tests.sh — NOT `supabase test db`/pg_prove; see
# that script's header for why), then type-checks the Edge Functions with
# Deno, then runs the customer-runner integration suites — the Phase 3
# auth/catalog suite AND the Phase 4 order suite (which spawns the real
# create_order / validate_promo / expire_stale_reservations handlers via
# supabase/functions/_dev/serve.ts; the CLI edge-runtime container is not
# used — see PHASE_4_IMPLEMENTATION_REPORT.md §20). All real network calls
# against this same local stack, never a mocked client. Kept separate
# from ci.yml so app-only changes don't need Postgres and schema-only
# changes don't need to build the Next.js apps.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/**"
      - "apps/customer-runner/__tests__/**"
      - "packages/**"
      - ".github/workflows/database.yml"
  # No `branches:` filter: this must run on every pull request, whatever its
  # base — the review stack is stacked PRs based on each other's branches,
  # not on main.
  #
  # No `paths:` filter either, and that is deliberate despite the cost.
  # `db-test` is a REQUIRED status check on main (Phase 10A). A required
  # check that is path-filtered never reports on a PR outside those paths,
  # and GitHub treats "never reported" as "not satisfied" — so a
  # documentation-only PR became permanently unmergeable. Phase 10C's own
  # PR was the first to hit it.
  #
  # The alternatives were worse: dropping `db-test` from the required set
  # would let a genuinely broken migration merge, and a companion
  # skip-job that reports success under the same name reports green
  # without having checked anything. Nine minutes on a docs PR is the
  # cheaper mistake.
  pull_request:

# Least privilege (Phase 10A). This workflow only needs to read the
# repository; it deploys nothing and writes nothing back. Declaring it
# explicitly means the job keeps a read-only token even if the
# repository default is later widened.
permissions:
  contents: read

jobs:
  db-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Pinned, not `latest`. The pgTAP suite asserts GRANT-level denial
      # (a hard 42501) for tables that anon/authenticated must not touch at
      # all. Whether that holds depends on which role the CLI creates tables
      # as: Postgres applies the default ACL of the creating role, and the
      # Supabase image ships a restrictive default for `postgres`
      # (anon/authenticated = Dxtm, no DML) alongside a permissive one for
      # `supabase_admin` (arwdDxtm). On `latest`, 7 assertions across
      # 05/06 flipped from "denied 42501" to "no exception" - the grants were
      # present, so denial fell back to RLS returning 0 rows instead.
      #
      # RLS still protected the data in every one of those cases; what was
      # lost is the defence-in-depth layer RBAC_MATRIX.md §4/§5 claims. The
      # real fix is explicit REVOKEs in a migration, which is out of scope
      # for a CI change - see docs/engineering/CI_CHECKPOINT_REPORT.md §8.
      # Unpin once that lands.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # The order integration suite spawns the real handlers through
      # supabase/functions/_dev/serve.ts, which is Deno - so Deno is needed
      # from this PR on, not from the payments PR.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database (apply migrations + seed)
        run: supabase db reset

      # --local is required: without it the CLI looks for a linked remote
      # project and exits 1 with "Cannot find project ref".
      - name: List applied migrations (visibility)
        run: supabase migration list --local

      # Invoked via `bash` rather than `./scripts/run-db-tests.sh`: this repo
      # lives on an exFAT volume during development, which does not
      # reliably preserve the executable bit through `git add` (verified —
      # git recorded mode 100644, not 100755, for this file). Calling it
      # through `bash` makes the workflow correct regardless of whatever
      # mode ends up committed.
      - name: Run pgTAP suite
        run: bash scripts/run-db-tests.sh

      - name: Type-check Edge Functions (Deno)
        run: npm run functions:check

      - name: Gateway adapter + production-safety tests (Deno)
        run: npm run functions:test

      - name: Install dependencies
        run: npm ci

      - name: Run customer-runner integration suites (Phase 3 auth/catalog + Phase 4 order)
        working-directory: apps/customer-runner
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export CRAAVEE_ALLOW_MOCK_CONTROL=1
          npm run test:integration

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
